[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Preserve browser API paths while routing them to Netlify serverless functions.
[[redirects]]
  from = "/api/look-motion"
  to = "/.netlify/functions/look-motion"
  status = 200
  force = true

[[redirects]]
  from = "/api/look-motion-status"
  to = "/.netlify/functions/look-motion-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/look-motion-video"
  to = "/.netlify/functions/look-motion-video"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-look"
  to = "/.netlify/functions/generate-look"
  status = 200
  force = true
